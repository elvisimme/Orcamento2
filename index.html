<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento 2.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{
  --papel:#F6F4EE; --superficie:#FFFFFF; --tinta:#22252B; --tinta2:#636A73; --linha:#E4E0D6;
  --marca:#2F6B4F; --marca-suave:#E4F0E8; --amarelo:#F4C430; --amarelo-suave:#FDF3D3;
  --receita:#2E8A57; --despesa:#D2553F; --invest:#3C78C8; --reserva:#E08A1E; --divida:#8E52A8; --cartao:#C2416B;
  --previsto:#8C949C; --fechada:#E3A21A; --conferido:#2E8A57;
  --contorno:#24262B; --sombra:0 2px 0 rgba(36,38,43,.06),0 6px 18px rgba(36,38,43,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#15171B; --superficie:#1F2227; --tinta:#ECEDEF; --tinta2:#A3A9B1; --linha:#30343B;
  --marca:#7CCB9E; --marca-suave:#22352B; --amarelo:#F4C430; --amarelo-suave:#3A3220;
  --receita:#6CCB93; --despesa:#F08A76; --invest:#86B3EE; --reserva:#F2B060; --divida:#C79BE0; --cartao:#EE8AAE;
  --previsto:#8C949C; --fechada:#F0B940; --conferido:#6CCB93; --contorno:#0B0C0E; --sombra:none; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#15171B; --superficie:#1F2227; --tinta:#ECEDEF; --tinta2:#A3A9B1; --linha:#30343B;
  --marca:#7CCB9E; --marca-suave:#22352B; --amarelo:#F4C430; --amarelo-suave:#3A3220;
  --receita:#6CCB93; --despesa:#F08A76; --invest:#86B3EE; --reserva:#F2B060; --divida:#C79BE0; --cartao:#EE8AAE;
  --previsto:#8C949C; --fechada:#F0B940; --conferido:#6CCB93; --contorno:#0B0C0E; --sombra:none; color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
h1,h2,h3{font-family:Nunito,system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-.01em}
h1{font-size:1.4rem} h2{font-size:1.12rem;margin-bottom:.6rem} h3{font-size:1rem}
a{color:var(--marca)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
/* ícones Fluent com contorno escuro, no estilo dos ícones escolhidos */
img.fe{width:1.6em;height:1.6em;flex:none;vertical-align:middle;
  filter:drop-shadow(1.2px 0 0 var(--contorno)) drop-shadow(-1.2px 0 0 var(--contorno)) drop-shadow(0 1.2px 0 var(--contorno)) drop-shadow(0 -1.2px 0 var(--contorno));transition:transform .2s}
img.fe.p{width:1.25em;height:1.25em;filter:drop-shadow(.8px 0 0 var(--contorno)) drop-shadow(-.8px 0 0 var(--contorno)) drop-shadow(0 .8px 0 var(--contorno)) drop-shadow(0 -.8px 0 var(--contorno))}
img.fe.g{width:2.4em;height:2.4em}
img.fe.xg{width:4.5em;height:4.5em}
.pula:hover img.fe,button:hover>img.fe{transform:translateY(-2px) rotate(-4deg)}
@media (prefers-reduced-motion:reduce){img.fe{transition:none}.pula:hover img.fe,button:hover>img.fe{transform:none}}

/* estrutura */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside.menu{position:sticky;top:0;height:100vh;background:var(--superficie);border-right:1px solid var(--linha);display:flex;flex-direction:column;gap:1.1rem;padding:1.1rem .8rem;overflow-y:auto}
.marca{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem;font-family:Nunito,sans-serif;font-weight:800;font-size:1.08rem;line-height:1.15}
.marca small{display:block;font-weight:700;color:var(--marca);font-size:.8rem}
nav.abas{display:flex;flex-direction:column;gap:.15rem}
nav.abas button{display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;border:0;border-radius:12px;background:none;color:var(--tinta2);cursor:pointer;text-align:left;font-weight:600}
nav.abas button:hover{background:var(--papel);color:var(--tinta)}
nav.abas button[aria-selected="true"]{background:var(--amarelo-suave);color:var(--tinta);font-weight:800;box-shadow:inset 3px 0 0 var(--amarelo)}
nav.abas .c{display:none}
.usuario{margin-top:auto;padding:.6rem;font-size:.8rem;color:var(--tinta2);border-top:1px solid var(--linha);overflow-wrap:anywhere}
header.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:1rem;padding:.8rem 2rem;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
header.topo h1{display:flex;align-items:center;gap:.55rem}
.mesnav{display:flex;align-items:center;gap:.3rem;margin-left:auto;position:relative}
.mesbtn{display:inline-flex;align-items:center;gap:.5rem;background:var(--superficie);border:1.5px solid var(--contorno);border-radius:12px;padding:.35rem .8rem;cursor:pointer;font-weight:800;font-family:Nunito,sans-serif;text-transform:capitalize;box-shadow:0 2px 0 var(--contorno)}
.mesbtn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--contorno)}
.ico{display:inline-grid;place-items:center;background:var(--superficie);border:1px solid var(--linha);border-radius:10px;width:2.2rem;height:2.2rem;cursor:pointer;color:var(--tinta)}
.balao{position:absolute;top:calc(100% + .5rem);right:0;z-index:25;background:var(--superficie);border:1.5px solid var(--contorno);border-radius:16px;padding:.8rem;width:290px;box-shadow:0 4px 0 var(--contorno),0 14px 30px rgba(0,0,0,.15)}
.balao .ano{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-family:Nunito,sans-serif;font-weight:800;font-size:1.1rem}
.balao .meses{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.balao .meses button{border:1px solid var(--linha);background:var(--papel);border-radius:10px;padding:.5rem 0;cursor:pointer;font-weight:700;text-transform:capitalize;position:relative}
.balao .meses button.tem::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--marca)}
.balao .meses button.sel{background:var(--amarelo);border-color:var(--contorno);color:#22252B}
.balao .meses button.hoje{outline:2px dashed var(--marca);outline-offset:-4px}
.balao .rodape{display:flex;justify-content:space-between;margin-top:.7rem}
main{padding:1.5rem 2rem 3rem}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside.menu{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:20;flex-direction:row;padding:.25rem .2rem calc(.25rem + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--linha);overflow:visible}
  .marca,.usuario{display:none}
  nav.abas{flex-direction:row;width:100%;justify-content:space-around;overflow-x:auto}
  nav.abas{overflow:visible}
  nav.abas button{flex:1 1 0;flex-direction:column;gap:.1rem;padding:.3rem 0;font-size:.6rem;text-align:center;min-width:0}
  nav.abas button img.fe{width:1.45em;height:1.45em}
  nav.abas button[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--amarelo)}
  nav.abas .l{display:none} nav.abas .c{display:inline}
  header.topo{padding:.6rem 1rem} header.topo h1{font-size:1.15rem} main{padding:1rem 1rem 6.5rem}
  .balao{right:-.5rem}
}

/* blocos */
.painel{background:var(--superficie);border:1px solid var(--linha);border-radius:18px;padding:1.15rem 1.25rem;box-shadow:var(--sombra);margin-bottom:1.25rem;min-width:0}
.colunas{display:grid;gap:0 1.25rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:1350px){.colunas{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.grade{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.kpis{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:1.25rem}
.kpi{background:var(--superficie);border:1px solid var(--linha);border-radius:18px;padding:.95rem 1.05rem;box-shadow:var(--sombra);display:flex;gap:.8rem;align-items:flex-start;min-width:0}
.kpi small{display:block;color:var(--tinta2);font-size:.82rem;font-weight:600}
.kpi strong{display:block;font-family:Nunito,sans-serif;font-size:1.32rem;font-weight:800;line-height:1.25;white-space:nowrap}
.kpi .sutil{display:block;margin-top:.15rem}
@media (max-width:600px){.kpis{grid-template-columns:1fr 1fr;gap:.6rem}.kpi{flex-direction:column;gap:.35rem;padding:.75rem}.kpi strong{font-size:1.05rem}}
.neg{color:var(--despesa)} .pos{color:var(--receita)} .sutil{color:var(--tinta2);font-size:.86rem}
.cab{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.6rem}
.cab h2{margin:0;display:flex;align-items:center;gap:.55rem}
.nome{display:inline-flex;align-items:center;gap:.55rem}
.vazio{text-align:center;padding:2rem 1rem;color:var(--tinta2)}
.vazio img{margin-bottom:.6rem}

/* barras */
.esteira{display:flex;height:2.2rem;border-radius:10px;overflow:hidden;margin:.6rem 0 .5rem;background:var(--papel);border:1.5px solid var(--contorno)}
.esteira div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.82rem;min-width:0;white-space:nowrap;overflow:hidden;transition:flex-grow .5s}
.t-E{background:var(--invest)}.t-V{background:var(--reserva)}.t-F{background:var(--divida)}
.e0{background:repeating-linear-gradient(135deg,var(--previsto) 0 8px,color-mix(in srgb,var(--previsto) 75%,#000) 8px 16px)}.e1{background:var(--fechada);color:#2b1d00!important}.e2{background:var(--conferido)}
.legenda{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.86rem;align-items:center}
.legenda>span{display:inline-flex;align-items:center;gap:.35rem}
.legenda i{display:inline-block;width:.85rem;height:.85rem;border-radius:4px;border:1px solid var(--contorno)}
.barra{height:.55rem;background:var(--papel);border-radius:6px;position:relative;min-width:70px;border:1px solid var(--linha);overflow:hidden}
.barra b{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--marca)}
.barra b.estouro{background:var(--despesa)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;align-items:center;padding:.6rem 0;border-bottom:1px dashed var(--linha)}
.meta:last-child{border-bottom:0}
.meta .barra{height:.8rem}
.meta .barra b{background:linear-gradient(90deg,var(--reserva),var(--amarelo))}

/* tabelas */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--linha);vertical-align:middle}
th{color:var(--tinta2);font-weight:700;font-size:.82rem}
td.v,th.v{text-align:right;white-space:nowrap}
tfoot th{border-top:2px solid var(--linha);color:var(--tinta);font-weight:800}
.rolagem{overflow-x:auto}
tr.atual td{background:var(--amarelo-suave)}
tr.futuro td{color:var(--tinta2);font-style:italic}
tr.grupo td{background:var(--papel);font-weight:800;font-family:Nunito,sans-serif}
tr.sub td:first-child{padding-left:2.4rem}
tr.sub td{font-size:.88rem}
table.contas td:first-child{white-space:nowrap}
.abre{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:var(--tinta);text-align:left;display:inline-flex;align-items:center;gap:.5rem}
.selo{border:0;border-radius:999px;padding:.12rem .55rem .12rem .3rem;font-size:.78rem;font-weight:800;cursor:pointer;color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:.25rem}
.selo.c0{background:var(--previsto)}.selo.c1{background:var(--fechada);color:#2b1d00}.selo.c2{background:var(--conferido)}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.74rem;font-weight:700;border-radius:999px;padding:.05rem .5rem;background:var(--marca-suave);color:var(--marca);white-space:nowrap}
.tag.alerta{background:var(--amarelo-suave);color:#8A5A00}
th.ord button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;display:inline-flex;gap:.25rem;align-items:center}
th.ord[aria-sort] button{color:var(--tinta)}
input.inf{width:8.5rem;text-align:right;padding:.3rem .45rem}
table.matriz{font-size:.84rem}
table.matriz th,table.matriz td{padding:.35rem .45rem}
table.matriz .fixa{position:sticky;left:0;background:var(--superficie);z-index:1;min-width:13rem;text-align:left}
table.matriz tr.cat th,table.matriz tr.cat td{background:var(--marca-suave);font-weight:800}
.tendencia svg{width:100%;height:auto;max-height:240px;display:block}

/* formulários */
.filtros{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.filtros>*{flex:1 1 140px}
label{display:block;font-size:.84rem;color:var(--tinta2);margin-bottom:.2rem;font-weight:600}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--linha);border-radius:10px;background:var(--papel)}
textarea{min-height:8rem;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.form{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.form .largo{grid-column:1/-1}
.btn{border:1.5px solid var(--contorno);background:var(--amarelo);color:#22252B;border-radius:12px;padding:.5rem 1rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;box-shadow:0 2px 0 var(--contorno);font-family:Nunito,sans-serif}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--contorno)}
.btn.sec{background:var(--superficie);color:var(--tinta)}
.btn.perigo{background:var(--superficie);color:var(--despesa);border-color:var(--despesa);box-shadow:0 2px 0 var(--despesa)}
.btn.mini{padding:.2rem .6rem;font-size:.82rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acoes{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.escolhas{display:grid;gap:.5rem;margin-top:.8rem}
.escolhas .btn{justify-content:flex-start}
.aviso{border-left:4px solid var(--amarelo);background:var(--amarelo-suave);padding:.7rem .9rem;border-radius:8px;margin:.75rem 0;font-size:.92rem}
.segmentos{display:inline-flex;border:1.5px solid var(--contorno);border-radius:10px;overflow:hidden;background:var(--superficie)}
.segmentos button{background:none;border:0;padding:.3rem .7rem;cursor:pointer;color:var(--tinta2);font-size:.85rem;font-weight:700}
.segmentos button+button{border-left:1.5px solid var(--contorno)}
.segmentos button[aria-pressed="true"]{background:var(--amarelo);color:#22252B}
.subabas{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:.6rem 1rem;border-radius:12px;z-index:40;max-width:90vw;font-weight:600}
@media (max-width:900px){.toast{bottom:calc(5.2rem + env(safe-area-inset-bottom,0px))}}
dialog{border:1.5px solid var(--contorno);border-radius:18px;background:var(--superficie);color:var(--tinta);width:min(720px,94vw);padding:1.2rem;box-shadow:0 5px 0 var(--contorno)}
dialog::backdrop{background:rgba(0,0,0,.4)}
pre.prompt{white-space:pre-wrap;background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:.8rem;font-size:.82rem;max-height:26rem;overflow:auto}
.oculto{display:none!important}
.confete{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confete i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cai 1.6s ease-in forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.confete{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="menu">
    <div class="marca"><span data-fe="dinheiro" data-cls="g"></span><span>Orçamento<small>versão 2.0</small></span></div>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="painel" data-ic="painel" aria-selected="true"><span class="l">Painel</span><span class="c">Painel</span></button>
      <button role="tab" data-aba="novo" data-ic="novo"><span class="l">Novo lançamento</span><span class="c">Novo</span></button>
      <button role="tab" data-aba="lanc" data-ic="lanc"><span class="l">Lançamentos</span><span class="c">Lista</span></button>
      <button role="tab" data-aba="analise" data-ic="analise"><span class="l">Análise</span><span class="c">Análise</span></button>
      <button role="tab" data-aba="orc" data-ic="orcamento"><span class="l">Orçamento</span><span class="c">Orçam.</span></button>
      <button role="tab" data-aba="cad" data-ic="cadastros"><span class="l">Cadastros</span><span class="c">Cadastro</span></button>
      <button role="tab" data-aba="ia" data-ic="ia"><span class="l">Prompt da IA</span><span class="c">IA</span></button>
      <button role="tab" data-aba="ajustes" data-ic="ajustes"><span class="l">Ajustes</span><span class="c">Ajustes</span></button>
    </nav>
    <div class="usuario" id="quem"></div>
  </aside>
  <div>
    <header class="topo">
      <h1 id="tituloAba">Painel</h1>
      <div class="mesnav">
        <button class="ico" id="mesAnt" aria-label="Mês anterior">‹</button>
        <button class="mesbtn" id="mesBtn" aria-haspopup="dialog"><span data-fe="calendario" data-cls="p"></span><span id="mesLbl"></span></button>
        <button class="ico" id="mesProx" aria-label="Próximo mês">›</button>
        <div class="balao oculto" id="balao" role="dialog" aria-label="Escolher mês"></div>
      </div>
    </header>
    <main>
      <section id="aba-painel"></section>
      <section id="aba-novo" class="oculto"></section>
      <section id="aba-lanc" class="oculto"></section>
      <section id="aba-analise" class="oculto"></section>
      <section id="aba-orc" class="oculto"></section>
      <section id="aba-cad" class="oculto"></section>
      <section id="aba-ia" class="oculto"></section>
      <section id="aba-ajustes" class="oculto"></section>
    </main>
  </div>
</div>
<dialog id="dlg"><div id="dlgCorpo"></div></dialog>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const brl=v=>(Math.abs(v||0)<0.005?0:v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brl0=v=>Math.round(v||0).toLocaleString("pt-BR");
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesLabel=m=>{const[y,mm]=m.split("-");return `${MESES[+mm-1]}/${y}`};
const mesCurto=m=>`${MESES[+m.slice(5)-1]}/${m.slice(2,4)}`;
const addMes=(m,n)=>{let[y,mm]=m.split("-").map(Number);mm+=n;y+=Math.floor((mm-1)/12);mm=((mm-1)%12+12)%12+1;return `${y}-${p2(mm)}`};
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const MES_HOJE=hojeISO().slice(0,7);
const semAcento=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const limpa=s=>s==null?"":String(s).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
const novoId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=v=>Math.round((+v||0)*100)/100;
const dataBR=d=>d?d.split("-").reverse().join("/"):"";
const diaValido=(y,m,d)=>Math.min(d,new Date(y,m,0).getDate());
const clone=o=>JSON.parse(JSON.stringify(o));
function fe(k,cls="",alt=""){const src=FE[k]||FE.outras;return `<img class="fe ${cls}" src="${src}" alt="${esc(alt)}" ${alt?"":'aria-hidden="true"'}>`}
function toast(msg,ms=3400){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function confete(){const box=document.createElement("div");box.className="confete";const cores=["#F4C430","#2E8A57","#3C78C8","#D2553F","#E08A1E","#8E52A8"];
  for(let i=0;i<60;i++){const c=document.createElement("i");c.style.left=Math.random()*100+"vw";c.style.background=cores[i%cores.length];c.style.animationDelay=Math.random()*.5+"s";c.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(c)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2400)}

function optsContas(sel,vazio,soAtivas){

}
const catObj=n=>C().catD.find(c=>c.nome===n);

function tipoSub(cat,sub){const c=catObj(cat);if(!c)return "V";const s=c.subs.find(x=>x.nome===sub);return (s&&s.tipo)||c.tipo||"V"}

/* ========= regras: mês da fatura, parcelas ========= */
function calcularPagto(conta,dc){
  if(!dc)dc=hojeISO();const[y,m,d]=dc.split("-").map(Number);const mc=`${y}-${p2(m)}`;
  const c=contaObj(conta);if(!c||c.grupo!=="cartao")return {m:mc,dp:dc};
  const F=+c.fech,V=+c.venc;
  if(F&&V){const fecha=d<F?mc:addMes(mc,1);const vence=V>F?fecha:addMes(fecha,1);const[yy,mm]=vence.split("-").map(Number);return {m:vence,dp:`${vence}-${p2(diaValido(yy,mm,V))}`}}
  const vm=addMes(mc,1);return {m:vm,dp:`${vm}-10`};
}
const confPadrao=conta=>grupoDe(conta)==="cartao"?0:2;
function gerarParcelas(base,n){
  n=Math.max(1,Math.min(60,+n||1));const total=Math.round(base.v*100),parc=Math.floor(total/n);const out=[];const g=n>1?"g"+novoId().slice(1):undefined;
  const {m,dp}=base.tp==="D"||base.tp==="R"?calcularPagto(base.f,base.dc):{m:base.dc.slice(0,7),dp:base.dc};
  for(let i=0;i<n;i++){const v=(i===n-1?total-parc*(n-1):parc)/100;const mi=addMes(m,i);const[yy,mm]=mi.split("-").map(Number);
    out.push({...base,id:novoId(),g,pi:n>1?i+1:undefined,pn:n>1?n:undefined,v,m:mi,dp:`${mi}-${p2(diaValido(yy,mm,+dp.slice(8,10)))}`,l:n>1?`${base.l} ${p2(i+1)}/${p2(n)}`:base.l,c:i===0?base.c:0})}
  return out;
}

/* ========= índices ========= */
function idx(){
  if(IDX)return IDX;const L=dados();const D={},Dm={},R={},Rm={},Gm={},mov={},tipoM={},meses=new Set();
  const mexe=(c,m,val,conf)=>{const o=((mov[c]=mov[c]||{})[m]=mov[c][m]||{all:0,c2:0,ent:0,sai:0});o.all+=val;if(conf===2)o.c2+=val;if(val>=0)o.ent+=val;else o.sai-=val};
  for(const l of L){
    meses.add(l.m);
    if(l.tp==="T"){if(l.f)mexe(l.f,l.m,-l.v,l.c);if(l.fd)mexe(l.fd,l.m,l.v,l.c);
      if(l.f&&l.fd){const lo=liquida(grupoDe(l.f)),ld=liquida(grupoDe(l.fd));if(lo&&!ld)Gm[l.m]=(Gm[l.m]||0)+l.v;else if(!lo&&ld)Gm[l.m]=(Gm[l.m]||0)-l.v}continue}
    if(l.tp==="D"){const k=l.m+"|"+l.cat+"|"+l.sub;D[k]=(D[k]||0)+l.v;Dm[l.m]=(Dm[l.m]||0)+l.v;const t=tipoSub(l.cat,l.sub);(tipoM[l.m]=tipoM[l.m]||{E:0,V:0,F:0})[t]+=l.v}
    else{const k=l.m+"|"+l.cat;R[k]=(R[k]||0)+l.v;Rm[l.m]=(Rm[l.m]||0)+l.v}
    if(l.f)mexe(l.f,l.m,l.tp==="R"?l.v:-l.v,l.c);
  }
  return IDX={D,Dm,R,Rm,Gm,mov,tipoM,meses,memo:{}};
}
/* totais que juntam histórico resumido (até set/2026) e lançamentos detalhados */
function totD(m,cat,sub){
  if(m<CORTE()){const h=H().despesas[m]||{};let t=0;for(const[k,v]of Object.entries(h)){const[c,s]=k.split("|");if((cat==null||c===cat)&&(sub==null||s===sub))t+=v}return t}
  const I=idx();if(cat==null)return I.Dm[m]||0;let t=0;for(const[k,v]of Object.entries(I.D)){const[mm,c,s]=k.split("|");if(mm===m&&c===cat&&(sub==null||s===sub))t+=v}return t;
}
function totR(m,cat){
  if(m<CORTE()){const h=H().receitas[m]||{};return cat==null?Object.values(h).reduce((a,b)=>a+b,0):(h[cat]||0)}
  const I=idx();return cat==null?(I.Rm[m]||0):(I.R[m+"|"+cat]||0);
}
function tipoMes(m){
  if(m<CORTE()){const o={E:0,V:0,F:0};for(const[k,v]of Object.entries(H().despesas[m]||{})){const[c,s]=k.split("|");o[tipoSub(c,s)]+=v}return o}
  return idx().tipoM[m]||{E:0,V:0,F:0};
}
const guardado=m=>m<CORTE()?(H().transferencias[m]||0):(idx().Gm[m]||0);
const temDados=m=>m<CORTE()?!!(H().despesas[m]||H().receitas[m]):idx().meses.has(m);

/* ========= saldos ========= */
function saldosMes(m){
  const I=idx();if(I.memo[m])return I.memo[m];const hs=H().saldos||{};
  return I.memo[m]=contas().map(c=>{
    if(!c.mes||m<c.mes){const fim=(hs[c.nome]||{})[m];return {c:c.nome,o:c,grupo:c.grupo,hist:true,fim:fim==null?null:fim}}
    let ini=+c.ini||0;for(let k=c.mes;k<m;k=addMes(k,1))ini+=((I.mov[c.nome]||{})[k]||{}).all||0;
    const o=(I.mov[c.nome]||{})[m]||{all:0,c2:0,ent:0,sai:0};const inf=((C().informados||{})[c.nome]||{})[m];
    return {c:c.nome,o:c,grupo:c.grupo,ini,ent:o.ent,sai:o.sai,real:ini+o.c2,prev:ini+o.all,fim:ini+o.all,inf};
  });
}
function resumoSaldos(m){
  const s=saldosMes(m).filter(x=>x.fim!=null&&(x.o.ativo!==false||Math.abs(x.fim)>0.005));const soma=f=>s.filter(f).reduce((a,x)=>a+x.fim,0);
  const somaIni=f=>s.filter(x=>!x.hist&&f(x)).reduce((a,x)=>a+x.ini,0);
  return {liq:soma(x=>liquida(x.grupo)),pat:soma(()=>1),liqIni:somaIni(x=>liquida(x.grupo)),patIni:somaIni(()=>1),porGrupo:Object.fromEntries(ORDEM_G.map(g=>[g,soma(x=>x.grupo===g)])),hist:s.some(x=>x.hist)};
}

}

/* ========= projeção (orçamento + programados) ========= */
const pendentes=m=>O().programados.filter(p=>!p.feito&&p.m===m);
function progPor(m){const o={R:0,D:{},Dsem:0,Tout:0};
  for(const p of pendentes(m)){if(p.tp==="R")o.R+=p.v;else if(p.tp==="D"){if(p.cat)o.D[p.cat]=(o.D[p.cat]||0)+p.v;else o.Dsem+=p.v}
    else if(p.tp==="T"){const lo=!p.f||liquida(grupoDe(p.f)),ld=p.fd&&liquida(grupoDe(p.fd));if(lo&&!ld)o.Tout+=p.v;else if(!lo&&ld)o.Tout-=p.v}}
  return o}
let MEDIAS=null,MEDIAS_K=null;
function mediaCat(c){const k=CACHE?dados().length+"|"+CORTE():"";if(MEDIAS_K!==k){MEDIAS={};MEDIAS_K=k}
  if(MEDIAS[c]==null){const ult=Array.from({length:12},(_,i)=>addMes(MES_HOJE,-12+i));MEDIAS[c]=ult.reduce((t,m)=>t+totD(m,c),0)/12}return MEDIAS[c]}
function previsaoMes(m){
  const pr=progPor(m),metas=O().metas[m]||{};let desp=pr.Dsem;const futuro=m>MES_HOJE;
  const cats=new Set([...alfa(C().catD.map(c=>c.nome)),...Object.keys(metas),...Object.keys(pr.D)]);
  for(const c of cats){const alvo=metas[c]!=null?metas[c]:(futuro?mediaCat(c):0);desp+=Math.max(alvo,totD(m,c)+(pr.D[c]||0))}
  return {rec:totR(m)+pr.R,desp,tout:guardado(m)+pr.Tout,prog:pr}
}
function projecao(MS){
  const out={};const fim=MS.reduce((a,b)=>a>b?a:b,MES_HOJE);let liq=null;
  for(const m of MS)if(m<MES_HOJE)out[m]={liq:resumoSaldos(m).liq};
  for(let m=MES_HOJE;m<=fim;m=addMes(m,1)){
    const p=previsaoMes(m);
    if(m===MES_HOJE){const real=resumoSaldos(m).liq;const lanc=totD(m),resto=Math.max(0,p.desp-lanc-Object.values(p.prog.D).reduce((a,b)=>a+b,0)-p.prog.Dsem);
      liq=real+p.prog.R-Object.values(p.prog.D).reduce((a,b)=>a+b,0)-p.prog.Dsem-p.prog.Tout-resto}
    else liq=liq+p.rec-p.desp-p.tout;
    out[m]={...(out[m]||{}),liq,rec:p.rec,desp:p.desp,tout:p.tout};
  }
  return out;
}

  const d=document.createElement("dialog");d.innerHTML=`<h2>Escolha um ícone</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr));gap:.5rem;margin:.8rem 0">${Object.keys(FE).filter(k=>!/_/.test(k)).map(k=>`<button class="ico pula" style="width:100%;height:3.4rem;${k===atual?"background:var(--amarelo-suave);border-color:var(--contorno)":""}" data-ic="${k}" title="${k}">${fe(k,"g")}</button>`).join("")}</div><button class="btn sec" data-ic="">Cancelar</button>`;
  document.body.appendChild(d);d.showModal();d.querySelectorAll("[data-ic]").forEach(b=>b.onclick=()=>{d.close();d.remove();ok(b.dataset.ic||null)});
})}

/* ========= mudanças em cadastros que afetam lançamentos ========= */
async function aplicarMudancas({conta={},cat={},sub={},rec={}}){
  const nc=n=>conta[n]||n;
  const mapD=(c,s)=>{const k=sub[`${c}|${s}`];if(k)return k.split("|");return [cat[c]||c,s]};
  const temConta=Object.keys(conta).length,temD=Object.keys(cat).length||Object.keys(sub).length,temR=Object.keys(rec).length;
  if(!temConta&&!temD&&!temR)return;
  await reescreverBase(l=>{if(temConta){l.f=nc(l.f);if(l.fd)l.fd=nc(l.fd)}if(temD&&l.tp==="D"){[l.cat,l.sub]=mapD(l.cat,l.sub)}if(temR&&l.tp==="R")l.cat=rec[l.cat]||l.cat;return l});
  const orc=clone(O());orc.programados.forEach(p=>{if(temConta){p.f=nc(p.f);p.fd=nc(p.fd)}if(p.tp==="D"&&temD)[p.cat,p.sub]=mapD(p.cat,p.sub);if(p.tp==="R"&&temR)p.cat=rec[p.cat]||p.cat});
  for(const m of Object.keys(orc.metas)){const n={};for(const[c,v]of Object.entries(orc.metas[m])){const c2=cat[c]||c;n[c2]=(n[c2]||0)+v}orc.metas[m]=n}
  const hist=clone(H());
  for(const m of Object.keys(hist.despesas)){const n={};for(const[k,v]of Object.entries(hist.despesas[m])){const[c,s]=k.split("|");const[c2,s2]=mapD(c,s);const k2=`${c2}|${s2}`;n[k2]=r2((n[k2]||0)+v)}hist.despesas[m]=n}
  for(const m of Object.keys(hist.receitas)){const n={};for(const[c,v]of Object.entries(hist.receitas[m])){const c2=rec[c]||c;n[c2]=r2((n[c2]||0)+v)}hist.receitas[m]=n}
  if(temConta){const s={};for(const[c,v]of Object.entries(hist.saldos||{}))s[nc(c)]=v;hist.saldos=s}
  await B().gravarDoc("orcamento",orc);await B().gravarDoc("historico",hist);invalida();
}

/* ========= exportação ========= */
function serial(iso){if(!iso)return null;const[y,m,d]=iso.split("-").map(Number);return (Date.UTC(y,m-1,d||1)-Date.UTC(1899,11,30))/864e5}
function gerarXlsx(){
  const wb=XLSX.utils.book_new();
  const cab=["Data compra","Data pagto","Mês","Tipo","Conta","Conta destino","Valor","Status","Local","Categoria","Subcategoria","Para quem","Projeto","Motivo","Descrição","Lançado por","ID"];
  const L=[...dados()].sort((a,b)=>(a.m+a.dp).localeCompare(b.m+b.dp));
  const aoa=[cab,...L.map(l=>[serial(l.dc),serial(l.dp),serial(l.m+"-01"),{D:"Despesa",R:"Receita",T:"Transferência"}[l.tp],l.f,l.fd||"",l.v,STATUS[l.c],l.l,l.cat,l.sub,l.pq,l.pj,l.mot||"",l.ds,l.a,l.id])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);for(let i=2;i<=aoa.length;i++){["A","B"].forEach(c=>{if(ws[c+i])ws[c+i].z="dd/mm/yyyy"});if(ws["C"+i])ws["C"+i].z="mmm/yy";if(ws["G"+i])ws["G"+i].z="#,##0.00"}
  ws["!autofilter"]={ref:`A1:Q${aoa.length}`};XLSX.utils.book_append_sheet(wb,ws,"Lançamentos");
  const meses=[];for(let m=addMes(MES_HOJE,-12);m<=addMes(MES_HOJE,3);m=addMes(m,1))meses.push(m);
  const aoaS=[["Conta","Grupo",...meses.map(mesCurto)],...contas().map(c=>[c.nome,GRUPOS[c.grupo].nome,...meses.map(m=>{const s=saldosMes(m).find(x=>x.c===c.nome);return s&&s.fim!=null?r2(s.fim):null})])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoaS),"Saldos");
  const mh=Object.keys(H().despesas).sort();const chaves=[...new Set(mh.flatMap(m=>Object.keys(H().despesas[m])))].sort();
  const aoaH=[["Categoria","Subcategoria",...mh],...chaves.map(k=>{const[c,s]=k.split("|");return [c,s,...mh.map(m=>H().despesas[m][k]||0)]})];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoaH),"Histórico despesas");
  return new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

  </div><div>
  <div class="painel"><h2>${fe("analise")} Excel e manutenção</h2>
    <p>Gera uma planilha com todos os lançamentos, os saldos mês a mês e o histórico por subcategoria.${CFG.modo==="onedrive"?" Uma cópia fica na pasta <b>exportacoes</b>.":""}</p>
    <div class="acoes"><button class="btn" id="ajExport">Gerar Excel</button>${CFG.modo==="onedrive"?`<button class="btn sec" id="ajConsol">Consolidar pendentes (${S.pend.length})</button>`:""}</div></div>
  <div class="painel"><h2>${fe("estrela")} Aparência</h2><div class="segmentos">${[["auto","Automático"],["light","Claro"],["dark","Escuro"]].map(([k,t])=>`<button data-tema="${k}" aria-pressed="${tema===k}">${t}</button>`).join("")}</div></div>
  <div class="painel"><h2>${fe("presentes")} Créditos</h2><p class="sutil">Ícones: <b>Fluent Emoji</b>, da Microsoft, licença MIT (github.com/microsoft/fluentui-emoji).</p></div>
  </div></div>`;
  $("#ajModo").onchange=e=>$("#ajOD").classList.toggle("oculto",e.target.value!=="onedrive");
  $("#ajSalvarCfg").onclick=async()=>{CFG.modo=$("#ajModo").value;CFG.clientId=$("#ajClient").value.trim();CFG.linkPasta=$("#ajLink").value.trim();gravarCfg(CFG);MSAL=null;await iniciar()};
  if($("#ajSair"))$("#ajSair").onclick=()=>OneDrive.sair();
  document.querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{const t=b.dataset.tema;if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;try{localStorage.setItem("orcamento2.tema",t)}catch{}renderAjustes()});
  $("#ajCarga").onchange=async e=>{const a=e.target.files[0];if(!a)return;
    if((S.cad||S.base.length)&&!confirm("Substituir tudo o que existe nesta pasta pela carga inicial?")){e.target.value="";return}
    try{const j=JSON.parse(await a.text());if(j.versao!==2||!j.cadastros)throw new Error("Este arquivo não é uma carga do Orçamento 2.0.");
      toast("Importando…");await B().gravarDoc("cadastros",j.cadastros);await B().gravarDoc("historico",j.historico);await B().gravarDoc("orcamento",j.orcamento);await B().gravarBase(j.lancamentos||[]);
      if(CFG.modo==="onedrive")for(const p of [...S.pend])if(p._arq)await OneDrive.gx("DELETE",`/drives/${OneDrive.D}/items/${p._arq}`);
      S.pend=[];invalida();S.mes=MES_HOJE;irAba("painel");toast(`Carga concluída: ${j.cadastros.contas.length} contas e ${(j.lancamentos||[]).length} lançamentos.`,6000);confete()}catch(x){toast(x.message,7000)}};
  $("#ajExport").onclick=async e=>{e.target.disabled=true;try{const blob=gerarXlsx();const nome=`Orcamento2_${hojeISO()}.xlsx`;const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(await B().enviarExport(blob,nome))toast("Excel gerado e salvo no OneDrive.");else toast("Excel gerado.")}catch(x){toast(x.message)}e.target.disabled=false};
  if($("#ajConsol"))$("#ajConsol").onclick=async e=>{e.target.disabled=true;try{const n=await B().consolidar();invalida();renderTudo();toast(`${n} pendentes consolidados.`)}catch(x){toast(x.message,6000);e.target.disabled=false}};
}

/* ========= navegação ========= */
let ABA="painel";
const TITULOS={painel:["Painel","painel"],novo:["Novo lançamento","novo"],lanc:["Lançamentos","lanc"],analise:["Análise","analise"],orc:["Orçamento","orcamento"],cad:["Cadastros","cadastros"],ia:["Prompt da IA","ia"],ajustes:["Ajustes","ajustes"]};
document.querySelectorAll("[data-fe]").forEach(s=>s.outerHTML=fe(s.dataset.fe,s.dataset.cls||""));
document.querySelectorAll("nav.abas button").forEach(b=>b.insertAdjacentHTML("afterbegin",fe(b.dataset.ic)));
try{const t=localStorage.getItem("orcamento2.tema");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch{}
function irAba(a){ABA=a;document.querySelectorAll("nav.abas button").forEach(b=>b.setAttribute("aria-selected",b.dataset.aba===a));
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("oculto",s.id!=="aba-"+a));const[t,ic]=TITULOS[a];$("#tituloAba").innerHTML=`${fe(ic)} ${t}`;renderAba();window.scrollTo(0,0)}
function renderAba(){({painel:renderPainel,novo:renderNovo,lanc:renderLanc,analise:renderAnalise,orc:renderOrc,cad:renderCad,ia:renderIA,ajustes:renderAjustes})[ABA]()}
function renderTudo(){$("#mesLbl").textContent=mesLabel(S.mes);$("#quem").textContent=CFG.modo==="onedrive"?S.usuario:"Modo de teste";renderAba()}
document.querySelectorAll("nav.abas button").forEach(b=>b.onclick=()=>irAba(b.dataset.aba));
$("#mesAnt").onclick=()=>{S.mes=addMes(S.mes,-1);renderTudo()};$("#mesProx").onclick=()=>{S.mes=addMes(S.mes,1);renderTudo()};
async function iniciar(){
  try{if(CFG.modo==="onedrive"){$("#aba-painel").innerHTML=`<div class="painel">Conectando ao OneDrive…</div>`;const conta=await OneDrive.login();if(!conta)return;await OneDrive.init()}
    await B().carregar();invalida();irAba(ABA);renderTudo()}
  catch(e){console.error(e);toast(e.message,7000);irAba("ajustes")}
}
iniciar();
</script>
</body>
</html>
